<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste Cronômetro</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 40px;
            background: #f5f5f5;
        }
        .test-case {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border-left: 4px solid #0E2C6E;
        }
        .test-case h3 {
            margin-top: 0;
            color: #0E2C6E;
        }
        .result {
            padding: 10px;
            background: #E8ECF7;
            border-radius: 4px;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Teste do Cronômetro de Palpites</h1>
    <p>Este arquivo demonstra como a função de cronômetro funciona com diferentes cenários.</p>
    
    <div id="testResults"></div>

    <script>
        /**
         * Função de cálculo do cronômetro (copiada do app.html)
         */
        function calculateTimeToLock(lockAtIso) {
            if (!lockAtIso) return { text: '—', isLocked: false };
            
            const lockAt = new Date(lockAtIso);
            const now = new Date();
            const diffMs = lockAt - now;
            
            if (diffMs <= 0) {
                return { text: 'BLOQUEADO', isLocked: true };
            }
            
            const diffSecs = Math.floor(diffMs / 1000);
            const diffMins = Math.floor(diffSecs / 60);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);
            
            if (diffDays > 1) {
                return { text: `${diffDays} ${diffDays === 1 ? 'dia' : 'dias'}`, isLocked: false };
            } else if (diffHours > 0) {
                const roundedHours = Math.round(diffMins / 60);
                return { text: `${roundedHours} ${roundedHours === 1 ? 'hora' : 'horas'}`, isLocked: false };
            } else {
                const roundedMins = Math.max(1, Math.round(diffSecs / 60));
                return { text: `${roundedMins} ${roundedMins === 1 ? 'minuto' : 'minutos'}`, isLocked: false };
            }
        }

        // Casos de teste
        const now = new Date();
        const tests = [
            {
                name: 'Mais de 3 dias',
                lockAt: new Date(now.getTime() + (4 * 24 * 60 * 60 * 1000)).toISOString(),
                expectedPattern: /\d+ dias/
            },
            {
                name: 'Exatamente 2 dias',
                lockAt: new Date(now.getTime() + (2 * 24 * 60 * 60 * 1000)).toISOString(),
                expectedPattern: /2 dias/
            },
            {
                name: 'Menos de 1 dia (12 horas)',
                lockAt: new Date(now.getTime() + (12 * 60 * 60 * 1000)).toISOString(),
                expectedPattern: /\d+ horas/
            },
            {
                name: 'Menos de 2 horas (30 minutos)',
                lockAt: new Date(now.getTime() + (30 * 60 * 1000)).toISOString(),
                expectedPattern: /\d+ minutos/
            },
            {
                name: 'Menos de 1 minuto (20 segundos)',
                lockAt: new Date(now.getTime() + (20 * 1000)).toISOString(),
                expectedPattern: /1 minuto/
            },
            {
                name: 'Já passou (bloqueado)',
                lockAt: new Date(now.getTime() - (5 * 60 * 1000)).toISOString(),
                expectedPattern: /BLOQUEADO/
            },
            {
                name: 'Sem lock_at',
                lockAt: null,
                expectedPattern: /—/
            }
        ];

        const resultsDiv = document.getElementById('testResults');

        tests.forEach((test, index) => {
            const result = calculateTimeToLock(test.lockAt);
            const passed = test.expectedPattern.test(result.text);
            const isLockedCorrect = (test.expectedPattern.test('BLOQUEADO') && result.isLocked) ||
                                    (!test.expectedPattern.test('BLOQUEADO') && !result.isLocked);

            const testDiv = document.createElement('div');
            testDiv.className = 'test-case';
            testDiv.innerHTML = `
                <h3>Teste ${index + 1}: ${test.name}</h3>
                <p><strong>Esperado:</strong> ${test.expectedPattern.source}</p>
                <p><strong>Lock At:</strong> ${test.lockAt || 'null'}</p>
                <div class="result" style="background: ${passed && isLockedCorrect ? '#E8F5E9' : '#FFEBEE'};">
                    Resultado: <strong>${result.text}</strong> ${passed && isLockedCorrect ? '✓' : '✗'}
                </div>
                <p><strong>isLocked:</strong> ${result.isLocked}</p>
            `;
            resultsDiv.appendChild(testDiv);
        });

        // Teste de atualização em tempo real
        const liveTestDiv = document.createElement('div');
        liveTestDiv.className = 'test-case';
        liveTestDiv.style.borderLeftColor = '#E2B045';
        liveTestDiv.innerHTML = `
            <h3>Teste ao Vivo: Cronômetro em Tempo Real</h3>
            <p>Este teste mostra um cronômetro contando para trás em tempo real.</p>
            <p>Lock em: <span id="liveTime"></span></p>
            <p id="liveResult" class="result"></p>
        `;
        resultsDiv.appendChild(liveTestDiv);

        // Atualiza a cada segundo
        const liveTime = document.getElementById('liveTime');
        const liveResult = document.getElementById('liveResult');
        const futureTime = new Date(now.getTime() + (5 * 60 * 1000)); // 5 minutos no futuro

        function updateLiveTest() {
            liveTime.textContent = futureTime.toLocaleTimeString('pt-BR');
            const result = calculateTimeToLock(futureTime.toISOString());
            liveResult.textContent = `⏱️ ${result.text}`;
        }

        updateLiveTest();
        setInterval(updateLiveTest, 1000);
    </script>
</body>
</html>
